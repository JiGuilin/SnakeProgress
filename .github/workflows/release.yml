name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            snake-progress-app/src-tauri -> target

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: snake-progress-app/package.json
          registry-url: "https://registry.npmjs.org"

      - name: Install frontend dependencies
        working-directory: snake-progress-app
        run: npm install --registry=https://registry.npmjs.org

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: "SnakeProgress ${{ github.ref_name }}"
          releaseBody: |
            ## SnakeProgress ${{ github.ref_name }}

            🐍 桌面贪吃蛇进度条 — 把"时间进度"变成"屏幕边框的一部分"。

            ### ✨ Features
            - Pixel snake crawling along screen borders to visualize workday progress
            - 18 built-in themes (Classic, Cyberpunk, Retro, Ocean, Sakura, Aurora, etc.)
            - Snake body effects (breathing, pulse, rainbow, glow, ripple, sparkle, wave)
            - Snake body motion animations (wiggle, wave, bounce, coil)
            - Head/tail animations (nod, bob, wobble, swish, curl, flame, etc.)
            - Multiple head shapes & skin textures
            - Milestone power-ups at 25%/50%/75%
            - Customizable start position, direction (clockwise/counterclockwise) & display mode
            - Lunch break detection with progress pause
            - Auto-hide on fullscreen, click-through, auto-start
            - Config import/export
            - Dark/light settings UI

            ### 📥 Downloads
            - **macOS**: `.dmg` installer (Apple Silicon / Intel)
            - **Windows**: `.msi` / `.exe` installer
            - **Linux**: `.deb` / `.AppImage`

            ### ⌨️ Shortcuts
            - `Ctrl+Shift+S` — Toggle snake visibility
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
