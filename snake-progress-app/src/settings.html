<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贪吃蛇进度条设置</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="settings-body">
  <div class="settings-shell">
    <!-- 头部 -->
    <header class="settings-header">
      <div class="header-brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M2 10C2 6 4 4 7 4C9 4 10 5 11 6C12 7 13 8 15 8C17 8 18 7 18 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="18" cy="5" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="header-title">设置</h1>
      </div>
      <div class="header-right">
        <button class="theme-toggle-btn" id="settingsThemeToggle" type="button" title="切换深色/浅色模式">
          <svg class="theme-icon-dark" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 12.5V2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
          <svg class="theme-icon-light" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <span class="header-app-name">SnakeProgress</span>
      </div>
    </header>

    <!-- 内容区：左侧导航 + 右侧面板 -->
    <div class="settings-content">
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="sectionWorkTime" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3l2 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>时间</span>
        </button>
        <button class="tab-btn" data-tab="sectionAppearance" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2l2.5 4H14l-2 3.5L13.5 14 8 11l-5.5 3L4 9.5 2 6h3.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          <span>外观</span>
        </button>
        <button class="tab-btn" data-tab="sectionLayout" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>
          <span>布局</span>
        </button>
        <button class="tab-btn" data-tab="sectionAnimation" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h3l2-4 3 8 2-4h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>动效</span>
        </button>
        <button class="tab-btn" data-tab="sectionDisplay" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 14h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>显示</span>
        </button>
        <button class="tab-btn" data-tab="sectionData" type="button">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>数据</span>
        </button>
      </nav>

      <main class="settings-main">
      <!-- 工作时间 -->
      <section class="settings-section active" id="sectionWorkTime">
        <div class="section-body">
          <div class="field-group">
            <div class="field">
              <label class="field-label" for="workStart">上班时间</label>
              <input class="field-input" type="time" id="workStart" value="09:00" />
            </div>
            <div class="field">
              <label class="field-label" for="workEnd">下班时间</label>
              <input class="field-input" type="time" id="workEnd" value="18:00" />
            </div>
          </div>

          <div class="field-divider"></div>

          <div class="toggle-field">
            <label class="toggle-label" for="lunchEnabled">
              <span class="toggle-text">启用午休时段</span>
            </label>
            <button class="toggle-switch" id="lunchEnabled" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="field-group lunch-row" id="lunchRow">
            <div class="field">
              <label class="field-label" for="lunchStart">午休开始</label>
              <input class="field-input" type="time" id="lunchStart" value="12:00" />
            </div>
            <div class="field">
              <label class="field-label" for="lunchEnd">午休结束</label>
              <input class="field-input" type="time" id="lunchEnd" value="13:00" />
            </div>
          </div>

          <div class="field-divider"></div>

          <div class="field field-vertical">
            <label class="field-label">工作日</label>
            <div class="weekdays" id="weekdays">
              <button class="weekday-btn active" data-day="1" type="button">一</button>
              <button class="weekday-btn active" data-day="2" type="button">二</button>
              <button class="weekday-btn active" data-day="3" type="button">三</button>
              <button class="weekday-btn active" data-day="4" type="button">四</button>
              <button class="weekday-btn active" data-day="5" type="button">五</button>
              <button class="weekday-btn" data-day="6" type="button">六</button>
              <button class="weekday-btn" data-day="7" type="button">日</button>
            </div>
          </div>

          <!-- 实时进度预览 -->
          <div class="progress-preview">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="previewBar" style="width: 0%;"></div>
            </div>
            <span class="progress-text" id="previewText">0%</span>
          </div>
        </div>
      </section>

      <!-- 外观样式 -->
      <section class="settings-section" id="sectionAppearance">
        <div class="section-body">
          <div class="theme-grid" id="themeGrid"></div>

          <div class="field-divider"></div>

          <div class="color-row">
            <div class="color-item">
              <label class="field-label" for="snakeColor">蛇身颜色</label>
              <input class="color-swatch" type="color" id="snakeColor" value="#00FF00" />
            </div>
            <div class="color-item">
              <label class="field-label" for="headColor">蛇头颜色</label>
              <input class="color-swatch" type="color" id="headColor" value="#FFFF00" />
            </div>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="rainbowMode">
              <span class="toggle-text">彩虹模式</span>
            </label>
            <button class="toggle-switch" id="rainbowMode" role="switch" aria-checked="false" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>
        </div>
      </section>

      <!-- 布局设置 -->
      <section class="settings-section" id="sectionLayout">
        <div class="section-body">
          <div class="field">
            <label class="field-label" for="snakeLengthMode">长度模式</label>
            <select class="field-select" id="snakeLengthMode">
              <option value="trailing">尾随模式</option>
              <option value="fixed">固定长度</option>
            </select>
          </div>

          <div class="field" id="fixedLengthRow" style="display:none">
            <label class="field-label" for="fixedLengthPercent">固定长度比例</label>
            <div class="range-field">
              <input class="range-input" type="range" id="fixedLengthPercent" min="10" max="50" step="5" value="20" />
              <span class="range-value" id="fixedLengthPercentVal">20%</span>
            </div>
          </div>

          <div class="field-divider"></div>

          <div class="field">
            <label class="field-label" for="pixelSize">像素大小</label>
            <div class="range-field">
              <input class="range-input" type="range" id="pixelSize" min="1" max="20" step="1" value="8" />
              <span class="range-value" id="pixelSizeVal">8px</span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="opacity">透明度</label>
            <div class="range-field">
              <input class="range-input" type="range" id="opacity" min="0" max="100" step="5" value="80" />
              <span class="range-value" id="opacityVal">80%</span>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="margin">边框边距</label>
            <div class="range-field">
              <input class="range-input" type="range" id="margin" min="0" max="20" step="1" value="2" />
              <span class="range-value" id="marginVal">2px</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 动效设置 -->
      <section class="settings-section" id="sectionAnimation">
        <div class="section-body">
          <div class="field">
            <label class="field-label" for="animationSpeed">动画速度</label>
            <select class="field-select" id="animationSpeed">
              <option value="slow">慢速</option>
              <option value="normal" selected>正常</option>
              <option value="fast">快速</option>
            </select>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="showTrail">
              <span class="toggle-text">显示未完成轨迹</span>
            </label>
            <button class="toggle-switch" id="showTrail" role="switch" aria-checked="false" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="headGlow">
              <span class="toggle-text">蛇头发光效果</span>
            </label>
            <button class="toggle-switch" id="headGlow" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="straightMode">
              <span class="toggle-text">直线模式</span>
            </label>
            <button class="toggle-switch" id="straightMode" role="switch" aria-checked="false" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="field-divider"></div>

          <div class="field-group">
            <div class="field">
              <label class="field-label" for="headShape">蛇头形状</label>
              <select class="field-select" id="headShape">
                <option value="triangle">三角形</option>
                <option value="rectangle">长方形</option>
                <option value="square">正方形</option>
                <option value="circle">圆形</option>
                <option value="diamond">菱形</option>
                <option value="pixel" disabled>── 像素素材 ──</option>
                <option value="sprite_pixel">🎮 像素风</option>
                <option value="sprite_cute">🥰 可爱风</option>
                <option value="sprite_dragon">🐉 龙族风</option>
                <option value="sprite_robot">🤖 机械风</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="skinTexture">皮肤纹理</label>
              <select class="field-select" id="skinTexture">
                <option value="solid">纯色</option>
                <option value="checkerboard">鳞片</option>
                <option value="stripe">条纹</option>
                <option value="dots">圆点</option>
                <option value="pixel" disabled>── 像素素材 ──</option>
                <option value="sprite_pixel">🎮 像素风</option>
                <option value="sprite_scale">🛡️ 鳞甲纹理</option>
                <option value="sprite_armor">⚙️ 装甲纹理</option>
                <option value="sprite_glow">✨ 发光体</option>
              </select>
            </div>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="showPowerUps">
              <span class="toggle-text">里程碑道具</span>
              <span class="toggle-hint">25%/50%/75%处显示食物</span>
            </label>
            <button class="toggle-switch" id="showPowerUps" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>
        </div>
      </section>

      <!-- 显示设置 -->
      <section class="settings-section" id="sectionDisplay">
        <div class="section-body">
          <div class="toggle-field">
            <label class="toggle-label" for="autoHideFullscreen">
              <span class="toggle-text">全屏时自动隐藏</span>
            </label>
            <button class="toggle-switch" id="autoHideFullscreen" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="clickThrough">
              <span class="toggle-text">鼠标穿透</span>
            </label>
            <button class="toggle-switch" id="clickThrough" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="autoStart">
              <span class="toggle-text">开机自启</span>
            </label>
            <button class="toggle-switch" id="autoStart" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="showOnNonWorkdays">
              <span class="toggle-text">非工作日也显示</span>
            </label>
            <button class="toggle-switch" id="showOnNonWorkdays" role="switch" aria-checked="false" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label" for="celebrationEnabled">
              <span class="toggle-text">完成庆祝动画</span>
            </label>
            <button class="toggle-switch" id="celebrationEnabled" role="switch" aria-checked="true" type="button">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="field-divider"></div>

          <div class="field">
            <label class="field-label">快捷键</label>
            <kbd class="kbd">Ctrl+Shift+S</kbd>
          </div>
        </div>
      </section>

      <!-- 数据管理 -->
      <section class="settings-section" id="sectionData">
        <div class="section-body">
          <div class="field">
            <label class="field-label">配置文件</label>
            <span class="field-hint" id="configPath">-</span>
          </div>
          <div class="field-divider"></div>
          <div class="btn-group">
            <button class="btn btn-ghost" id="exportBtn" type="button">导出配置</button>
            <button class="btn btn-ghost" id="importBtn" type="button">导入配置</button>
          </div>
          <input type="file" id="importFileInput" accept=".json" style="display:none" />
        </div>
      </section>
      </main>
    </div>

    <!-- 底部按钮 -->
    <footer class="settings-footer">
      <button class="btn btn-ghost" id="resetBtn" type="button">恢复默认</button>
      <button class="btn btn-primary" id="saveBtn" type="button">保存并关闭</button>
    </footer>
  </div>

  <!-- 自定义确认弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-dialog">
      <div class="modal-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14" r="1" fill="currentColor"/></svg>
      </div>
      <p class="modal-message" id="modalMessage">确定要恢复默认设置吗？</p>
      <p class="modal-sub" id="modalSub">所有自定义配置将被清除</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel" type="button">取消</button>
        <button class="btn btn-danger" id="modalConfirm" type="button">确认恢复</button>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
